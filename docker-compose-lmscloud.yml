version: "3"
services:
  koha:
    image: ${KOHA_IMAGE} # e.g. KOHA_IMAGE=ghcr.io/lmscloudpauld/lmscloud-koha-{aarch64,x86_64}:latest docker compose ...
    volumes:
      - ${LMSC_SYNC_REPO}:/kohadevbox/koha
      # run.sh is baked into the image now — no overlay mount needed.
      # (Leaving one in with a relative path breaks under `ktd -f`, which
      # resolves ./ against its own cwd and shadows the image file.)
    environment:
      # Additional CPAN dependencies (if needed for development)
      # Note: Most deps should now be in the base 25.11 image
      - EXTRA_CPAN=${EXTRA_CPAN:-}
  es:
    image: koha/elasticsearch-icu:7.x-arm64
    environment:
      - cluster.name=docker-cluster
      - discovery.type=single-node
      - bootstrap.memory_lock=true
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
    ulimits:
      memlock:
        soft: -1
        hard: -1
    networks:
      - kohanet
